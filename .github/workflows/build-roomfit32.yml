name: RoomFit 3.9.5 Original Uploaded AR APK
on:
  push:
    branches: [roomfit-3.9.5-native-preview]
    paths:
      - 'roomfit32/**'
      - 'roomfit33/**'
      - 'roomfit34/**'
      - 'roomfit35/**'
      - 'roomfit36/**'
      - 'roomfit37/**'
      - 'roomfit38/**'
      - 'roomfit39/**'
      - 'roomfit391/**'
      - 'roomfit392/**'
      - 'roomfit393/**'
      - 'roomfit394/**'
      - 'roomfit395/**'
      - '.github/workflows/build-roomfit32.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Unzip 3.1.1 source baseline
        run: |
          set -euo pipefail
          unzip -q RoomFit-3.1.1-Full-AR-Source.zip -d build-work
          test -f build-work/RoomFit-3.1.1-Full-AR-Source/app/src/main/assets/web/roomfit3.js
      - name: Patch RoomFit 3.2 recommendations
        run: |
          python roomfit32/roomfit32-patch.py build-work/RoomFit-3.1.1-Full-AR-Source
          test -f build-work/RoomFit-3.1.1-Full-AR-Source/app/src/main/assets/web/roomfit32-recommend.js
      - name: Enable visible AR preview with safety warnings
        run: |
          python roomfit32/roomfit32-ar-preview-fix.py build-work/RoomFit-3.1.1-Full-AR-Source
          grep -q "가구 미리보기" build-work/RoomFit-3.1.1-Full-AR-Source/app/src/main/java/kr/ac/roomfit/app/LockedArActivity.java
      - name: Add independent 3D viewer and Instant Placement fallback
        run: |
          cp roomfit32/FurniturePreviewActivity.java roomfit32/FurniturePreviewActivity.java.tmp
          mv roomfit32/FurniturePreviewActivity.java.tmp roomfit32/FurniturePreviewActivity.java
          python roomfit32/roomfit32-ar-3d-fix.py build-work/RoomFit-3.1.1-Full-AR-Source
          test -f build-work/RoomFit-3.1.1-Full-AR-Source/app/src/main/java/kr/ac/roomfit/app/FurniturePreviewActivity.java
      - name: Install RoomFit 3.3 guided flow and bottom navigation
        run: |
          cp roomfit33/roomfit33-ui.js build-work/RoomFit-3.1.1-Full-AR-Source/app/src/main/assets/web/roomfit33-ui.js
          cp roomfit33/roomfit33-ui.css build-work/RoomFit-3.1.1-Full-AR-Source/app/src/main/assets/web/roomfit33-ui.css
          python roomfit33/roomfit33-apply.py build-work/RoomFit-3.1.1-Full-AR-Source
          node --check build-work/RoomFit-3.1.1-Full-AR-Source/app/src/main/assets/web/roomfit33-ui.js
      - name: Install RoomFit 3.4 five-stage wizard and AR diagnostics
        run: |
          python roomfit34/roomfit34-apply.py build-work/RoomFit-3.1.1-Full-AR-Source
          node --check build-work/RoomFit-3.1.1-Full-AR-Source/app/src/main/assets/web/roomfit34-ui.js
          grep -q '5단계 진행' build-work/RoomFit-3.1.1-Full-AR-Source/app/src/main/assets/web/roomfit34-ui.js
      - name: Simplify AR to model placement and size warning
        run: |
          python roomfit35/roomfit35-simple-ar.py build-work/RoomFit-3.1.1-Full-AR-Source
          node --check build-work/RoomFit-3.1.1-Full-AR-Source/app/src/main/assets/web/roomfit34-ui.js
          grep -q 'Config.DepthMode.DISABLED' build-work/RoomFit-3.1.1-Full-AR-Source/app/src/main/java/kr/ac/roomfit/app/LockedArActivity.java
      - name: Fix AR camera texture binding and add real tracking diagnostics
        run: |
          python roomfit36/roomfit36_tracking_patch.py build-work/RoomFit-3.1.1-Full-AR-Source
          grep -q 'AR 카메라 프레임 대기' build-work/RoomFit-3.1.1-Full-AR-Source/app/src/main/java/kr/ac/roomfit/app/LockedArActivity.java
      - name: Fix hit-test fallback with camera-relative furniture placement
        run: |
          python roomfit37/roomfit37-ar-fallback.py build-work/RoomFit-3.1.1-Full-AR-Source
          grep -q '가구 바로 표시' build-work/RoomFit-3.1.1-Full-AR-Source/app/src/main/java/kr/ac/roomfit/app/LockedArActivity.java
      - name: Install RoomFit 3.8 standalone simple AR and direct step 4 to AR
        run: |
          python roomfit38/roomfit38-apply.py build-work/RoomFit-3.1.1-Full-AR-Source
          node --check build-work/RoomFit-3.1.1-Full-AR-Source/app/src/main/assets/web/roomfit34-ui.js
          node --check build-work/RoomFit-3.1.1-Full-AR-Source/app/src/main/assets/web/roomfit3.js
          grep -q 'SimpleFurnitureArActivity.class' build-work/RoomFit-3.1.1-Full-AR-Source/app/src/main/java/kr/ac/roomfit/app/MainActivity.java
      - name: Restore Scene Viewer floor tracking and remove floating native anchors
        shell: bash
        run: |
          set -euo pipefail
          python roomfit39/roomfit39-apply.py build-work/RoomFit-3.1.1-Full-AR-Source
          node --check build-work/RoomFit-3.1.1-Full-AR-Source/app/src/main/assets/web/roomfit3.js
          grep -q 'RoomFitStableAR.open' build-work/RoomFit-3.1.1-Full-AR-Source/app/src/main/java/kr/ac/roomfit/app/MainActivity.java
          ! grep -q 'estimateAnchor(camera)' build-work/RoomFit-3.1.1-Full-AR-Source/app/src/main/java/kr/ac/roomfit/app/SimpleFurnitureArActivity.java
      - name: Fix native AR route and add tracked feature point placement
        run: |
          python roomfit391/roomfit391-patch.py build-work/RoomFit-3.1.1-Full-AR-Source
          node --check build-work/RoomFit-3.1.1-Full-AR-Source/app/src/main/assets/web/roomfit3.js
          grep -q 'feature=hit' build-work/RoomFit-3.1.1-Full-AR-Source/app/src/main/java/kr/ac/roomfit/app/SimpleFurnitureArActivity.java
      - name: Reconnect original uploaded RoomFit Scene Viewer intent exactly
        run: |
          python roomfit392/roomfit392-use-original-ar.py build-work/RoomFit-3.1.1-Full-AR-Source
          node --check build-work/RoomFit-3.1.1-Full-AR-Source/app/src/main/assets/web/roomfit3.js
          grep -q 'launchUploadedOriginalAR(scene)' build-work/RoomFit-3.1.1-Full-AR-Source/app/src/main/java/kr/ac/roomfit/app/MainActivity.java
      - name: Apply RoomFit 3.9.3 AR launch diagnostics
        run: |
          python roomfit393/patch.py build-work/RoomFit-3.1.1-Full-AR-Source
          node --check build-work/RoomFit-3.1.1-Full-AR-Source/app/src/main/assets/web/roomfit3.js
          node --check build-work/RoomFit-3.1.1-Full-AR-Source/app/src/main/assets/web/roomfit34-ui.js
      - name: Apply RoomFit 3.9.4 direct native AR menu
        run: |
          python roomfit394/patch.py build-work/RoomFit-3.1.1-Full-AR-Source
          node --check build-work/RoomFit-3.1.1-Full-AR-Source/app/src/main/assets/web/roomfit3.js
          node --check build-work/RoomFit-3.1.1-Full-AR-Source/app/src/main/assets/web/roomfit34-ui.js
      - name: Apply RoomFit 3.9.5 native AR preview
        run: |
          python roomfit395/patch.py build-work/RoomFit-3.1.1-Full-AR-Source
          node --check build-work/RoomFit-3.1.1-Full-AR-Source/app/src/main/assets/web/roomfit3.js
          node --check build-work/RoomFit-3.1.1-Full-AR-Source/app/src/main/assets/web/roomfit34-ui.js
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | sort -V | tail -n1)"
          fi
          test -x "$SDKMANAGER"
          printf 'ANDROID_HOME=%s\n' "$ANDROID_HOME" >> "$GITHUB_ENV"
          printf 'ANDROID_SDK_ROOT=%s\n' "$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Verify Javascript and build Android APK
        working-directory: build-work/RoomFit-3.1.1-Full-AR-Source
        run: |
          node --check app/src/main/assets/web/roomfit3.js
          node --check app/src/main/assets/web/roomfit32-recommend.js
          chmod +x ./gradlew
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon --stacktrace :app:assembleDebug; then
              echo "Android APK build completed on attempt $attempt"
              break
            fi
            if [ "$attempt" -eq 3 ]; then echo "Build failed after retries"; exit 1; fi
            echo "Retrying Gradle build after dependency fetch issue ($attempt)"
            sleep 15
          done
      - name: Package APK and editable Android source
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build-work/RoomFit-3.1.1-Full-AR-Source/app/build/outputs/apk/debug/app-debug.apk dist/RoomFit-3.9.5-Original-AR-debug.apk
          mkdir -p build-work/RoomFit-3.1.1-Full-AR-Source/tools
          cp roomfit32/roomfit32-patch.py build-work/RoomFit-3.1.1-Full-AR-Source/tools/roomfit32-patch.py
          cp roomfit32/roomfit32-ar-preview-fix.py build-work/RoomFit-3.1.1-Full-AR-Source/tools/roomfit32-ar-preview-fix.py
          cp roomfit32/roomfit32-ar-3d-fix.py build-work/RoomFit-3.1.1-Full-AR-Source/tools/roomfit32-ar-3d-fix.py
          cp -r roomfit33 build-work/RoomFit-3.1.1-Full-AR-Source/tools/roomfit33
          cp -r roomfit34 build-work/RoomFit-3.1.1-Full-AR-Source/tools/roomfit34
          cp -r roomfit35 build-work/RoomFit-3.1.1-Full-AR-Source/tools/roomfit35
          cp -r roomfit36 build-work/RoomFit-3.1.1-Full-AR-Source/tools/roomfit36
          cp -r roomfit37 build-work/RoomFit-3.1.1-Full-AR-Source/tools/roomfit37
          cp -r roomfit38 build-work/RoomFit-3.1.1-Full-AR-Source/tools/roomfit38
          cp -r roomfit39 build-work/RoomFit-3.1.1-Full-AR-Source/tools/roomfit39
          cp -r roomfit391 build-work/RoomFit-3.1.1-Full-AR-Source/tools/roomfit391
          cp -r roomfit392 build-work/RoomFit-3.1.1-Full-AR-Source/tools/roomfit392
          cd build-work
          mv RoomFit-3.1.1-Full-AR-Source RoomFit-3.9.5-Android-Source
          rm -rf RoomFit-3.9.5-Android-Source/app/build RoomFit-3.9.5-Android-Source/.gradle
          zip -qr ../dist/RoomFit-3.9.5-Android-Source.zip RoomFit-3.9.5-Android-Source -x '*.DS_Store'
      - uses: actions/upload-artifact@v4
        with:
          name: RoomFit-3.9.5-APK
          path: dist/RoomFit-3.9.5-Original-AR-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: RoomFit-3.9.5-Source
          path: dist/RoomFit-3.9.5-Android-Source.zip
          if-no-files-found: error