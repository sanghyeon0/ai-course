name: RoomFit 3.1.1 Full AR APK

on:
  push:
    branches:
      - roomfit-3.1.1-apk-build
    paths:
      - 'RoomFit-3.1.1-Full-AR-Source.zip'
      - '.github/workflows/roomfit-3.1.1-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Unpack full RoomFit Android project
        shell: bash
        run: |
          set -euo pipefail
          test -s RoomFit-3.1.1-Full-AR-Source.zip
          unzip -q RoomFit-3.1.1-Full-AR-Source.zip -d work
          test -f work/RoomFit-3.1.1-Full-AR-Source/settings.gradle
          test -f work/RoomFit-3.1.1-Full-AR-Source/gradle/wrapper/gradle-wrapper.jar

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK (use runner preinstalled tools)
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | sort -V | tail -n1)"
          fi
          test -x "$SDKMANAGER"
          printf 'ANDROID_HOME=%s\n' "$ANDROID_HOME" >> "$GITHUB_ENV"
          printf 'ANDROID_SDK_ROOT=%s\n' "$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
          "$SDKMANAGER" --list_installed | grep -E 'platforms;android-35|build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile full native RoomFit app
        working-directory: work/RoomFit-3.1.1-Full-AR-Source
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare downloadable APK
        run: |
          mkdir -p dist
          cp work/RoomFit-3.1.1-Full-AR-Source/app/build/outputs/apk/debug/app-debug.apk dist/RoomFit-3.1.1-Full-AR-debug.apk

      - name: Upload APK for phone installation
        uses: actions/upload-artifact@v4
        with:
          name: RoomFit-3.1.1-Full-AR-APK
          path: dist/RoomFit-3.1.1-Full-AR-debug.apk
          if-no-files-found: error
